<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pandorf Swap · GIWA Sepolia</title>
<meta name="description" content="A minimal exchange on GIWA Sepolia built with the Ammora SDK." />
<style>
  :root {
    --bg: #0c0f14; --panel: #151a22; --line: #232a35; --text: #e8edf4; --muted: #8a95a6;
    --accent: #7c6cff; --accent2: #2fd3b5; --err: #ff6b6b; --ok: #2fd3b5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    color: var(--text); background: radial-gradient(1200px 600px at 70% -10%, #1d1840 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #0f2b2a 0%, transparent 60%), var(--bg);
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; max-width: 980px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .2px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; }
  #connect { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 9px 14px; }
  #connect:hover { border-color: var(--accent); }
  main { max-width: 440px; margin: 28px auto 60px; padding: 0 16px; }
  .card { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: 0 20px 60px #0007; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  select, input { font: inherit; color: var(--text); background: #0f131a; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #0f131a; border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin: 14px 0; }
  .tabs button { background: transparent; color: var(--muted); padding: 8px; }
  .tabs button.active { background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .box { background: #0f131a; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .box + .box { margin-top: 8px; }
  .label { color: var(--muted); font-size: 12.5px; }
  .amount { width: 100%; border: 0; background: transparent; font-size: 28px; padding: 6px 0 0; outline: none; }
  .out { font-size: 28px; padding-top: 6px; }
  .sym { font-weight: 600; }
  #max { background: transparent; color: var(--accent); font-size: 12.5px; padding: 0; }
  .meta { margin: 12px 2px 0; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
  .meta b { color: var(--text); font-weight: 500; }
  #swap { width: 100%; margin-top: 14px; padding: 14px; font-weight: 600; color: #fff; background: linear-gradient(135deg, var(--accent), #5a8bff); }
  #swap:disabled { opacity: .45; cursor: not-allowed; }
  .status { min-height: 20px; margin-top: 10px; font-size: 13px; color: var(--muted); text-align: center; }
  .status.err { color: var(--err); } .status.ok { color: var(--ok); }
  a { color: var(--accent2); }
  details { margin-top: 14px; font-size: 13px; color: var(--muted); }
  details form { display: grid; gap: 8px; margin-top: 10px; }
  details button { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 8px; }
  footer { text-align: center; color: var(--muted); font-size: 12.5px; padding: 0 16px 40px; }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo"></div> Pandorf Swap <span class="chip">GIWA Sepolia</span></div>
  <button id="connect">Connect wallet</button>
</header>

<main>
  <div class="card">
    <div class="row">
      <select id="market" aria-label="Market"></select>
      <span class="label">pool <a id="pool-link" target="_blank" rel="noopener">—</a></span>
    </div>

    <div class="tabs">
      <button data-side="buy" class="active">Buy <span id="pair-symbol">tAMM</span></button>
      <button data-side="sell">Sell</button>
    </div>

    <div class="box">
      <div class="row"><span class="label">You pay</span><span class="label">Balance <span id="balance">—</span> · <button id="max">Max</button></span></div>
      <div class="row"><input id="amount" class="amount" inputmode="decimal" placeholder="0.0" autocomplete="off" /><span id="in-symbol" class="sym">ETH</span></div>
    </div>
    <div class="box">
      <div class="label">You receive (estimated)</div>
      <div class="row"><div id="out" class="out">0</div><span id="out-symbol" class="sym">tAMM</span></div>
    </div>

    <div class="meta">
      <div class="row"><span>Minimum received</span><b id="min-out">—</b></div>
      <div class="row"><span>Slippage</span>
        <select id="slippage" aria-label="Slippage">
          <option value="50">0.5%</option><option value="100" selected>1%</option><option value="300">3%</option>
        </select>
      </div>
      <div class="row"><span>Routing</span><b>Ammora SDK · native ETH router</b></div>
    </div>

    <button id="swap" disabled>Swap</button>
    <div id="status" class="status"></div>

    <details id="custom">
      <summary>Add another Ammora pool</summary>
      <form id="custom-form">
        <input id="c-pool" placeholder="Pool address 0x…" />
        <input id="c-token" placeholder="Token address 0x…" />
        <select id="c-model">
          <option value="compounding">Compounding pool (ARL)</option>
          <option value="concentrated">Concentrated pool (ARL)</option>
          <option value="almm">ALMM bin pool</option>
          <option value="dbc">Launch curve (pre-graduation)</option>
        </select>
        <button type="submit">Add pool</button>
      </form>
    </details>
  </div>
</main>

<footer>
  Testnet only · Built with <a href="https://www.npmjs.com/package/@ammora-protocol/sdk" target="_blank" rel="noopener">@ammora-protocol/sdk</a> ·
  by <a href="https://x.com/pandorfsol" target="_blank" rel="noopener">@pandorfsol</a>
</footer>
<script type="module" src="/app.js"></script>
</body>
</html>
